# Render blueprint (single instance with a persistent disk). Check against the current Render docs.
services:
  - type: web
    name: shewiun-cfa
    runtime: docker
    plan: starter
    healthCheckPath: /api/health/ready
    disk:
      name: cfa-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - { key: CFA_ENV, value: production }
      - { key: CFA_DATABASE_PATH, value: /data/cfa.db }
      - { key: CFA_BILLING, value: "on" }
      - { key: FORWARDED_ALLOW_IPS, value: "*" }
      - { key: CFA_API_KEYS, sync: false }      # token:admin:Name
      - { key: CFA_SECRET_KEY, sync: false }    # a Fernet key, see .env.example
      - { key: HF_TOKEN, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_PRICE_PRO, sync: false }
      - { key: STRIPE_PRICE_TEAM, sync: false }
