# Fly.io single machine with a volume. Check against the current Fly docs before you deploy.
# fly launch --no-deploy;  fly volumes create cfa_data --size 3 --region fra
# fly secrets set CFA_API_KEYS="<token>:admin:You" CFA_SECRET_KEY="<fernet key>" HF_TOKEN="hf_..." STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_PRO=... STRIPE_PRICE_TEAM=...
app = "shewiun-cfa"
primary_region = "fra"

[build]

[env]
  CFA_ENV = "production"
  CFA_DATABASE_PATH = "/data/cfa.db"
  CFA_BILLING = "on"
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "25s"
    interval = "30s"
    method = "GET"
    path = "/api/health/ready"
    timeout = "5s"

[[mounts]]
  source = "cfa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
